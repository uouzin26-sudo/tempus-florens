      u.uB.value = sine(c01((c - 3) / 4)) * (1 - sine(c01((c - 10) / 4.5)));
      PU.uB.value = u.uB.value; PU.uLift.value = u.uLift.value * e; PU.uT.value = t;
    } else if (G.F.type === 3) {
      u.uA.value = sine(c01((lt - 1) / 2));
    } else if (G.F.type === 4) {
      u.uA.value = sine(c01((lt - .8) / 2.5));
    }
  });
}

// ---------- UI ----------
const tag = document.getElementById('tag');
let tStart = null;
anchor.onTargetFound = () => { if (tStart === null) tStart = performance.now(); tag.textContent = 'TEMPUS FLORENS · ORCHIDACEAE'; };
anchor.onTargetLost = () => { tag.textContent = 'SEARCHING FOR THE POSTCARD'; };
document.getElementById('replay').addEventListener('click', () => { if (tStart !== null) tStart = performance.now(); });
document.getElementById('go').addEventListener('click', async () => {
  const err = document.getElementById('err'), go = document.getElementById('go');
  try {
    for (const f of ['./postcard.mind', './orchids.png']) {
      const chk = await fetch(f, { method: 'HEAD', cache: 'no-store' });
      if (!chk.ok) { err.hidden = false; err.textContent = f.slice(2) + ' not found — upload it next to postcard.html.'; return; }
    }
    go.textContent = 'Opening…';
    await mindar.start();
    document.getElementById('intro').hidden = true; tag.hidden = false; document.getElementById('dock').hidden = false;
    renderer.setAnimationLoop(() => { update(tStart === null ? 0 : (performance.now() - tStart) / 1000); renderer.render(scene, camera); });
  } catch (e) {
    go.textContent = 'Open camera'; err.hidden = false; err.textContent = 'Camera unavailable. Allow camera access, then reload.'; console.error(e);
  }
});
</script>

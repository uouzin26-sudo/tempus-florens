<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tempus florens — postcard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root { --cream: #f7f3e8; --ink: #44474e; --dim: #8b8d92; --line: rgba(68,71,78,.28);
  --f-serif: "Cormorant Garamond", "Times New Roman", serif; --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: var(--f-mono); overflow: hidden; }
#ar { position: fixed; inset: 0; }
.mindar-ui-scanning { display: none !important; }
.intro { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: var(--cream); }
.intro .wm { font-family: var(--f-serif); font-size: clamp(50px, 14vw, 88px); line-height: .9; color: #b9b6ad; }
.intro .wm i { font-style: italic; }
.intro p { margin: 0; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); line-height: 2; }
button { font: inherit; font-size: 10px; letter-spacing: .26em; text-transform: uppercase; cursor: pointer; color: var(--ink); padding: 13px 22px; background: transparent; border: 1px solid var(--line); border-radius: 0; }
button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
.err { color: #a2453d !important; letter-spacing: .06em !important; text-transform: none !important; }
.tag { position: fixed; z-index: 10; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 16px); text-align: center; font-size: 9px; letter-spacing: .26em; color: rgba(255,255,255,.85); text-shadow: 0 1px 8px rgba(0,0,0,.5); pointer-events: none; }
.dock { position: fixed; z-index: 10; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; justify-content: center; }
.dock button { color: #fff; border-color: rgba(255,255,255,.5); background: rgba(40,40,44,.35); backdrop-filter: blur(6px); padding: 9px 16px; }
</style>
</head>
<body>
<div id="ar"></div>
<div class="intro" id="intro">
  <div class="wm">te<i>m</i>pus flore<i>n</i>s</div>
  <p>Hold the postcard in view<br>and let the lily unfold</p>
  <button id="go">Open camera</button>
  <p class="err" id="err" hidden></p>
</div>
<div class="tag" id="tag" hidden>SEARCHING FOR THE POSTCARD</div>
<div class="dock" id="dock" hidden><button id="replay">↻ Again</button></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

// ---- postcard geometry (8000 × 5419 artwork; anchor width = 1) ----
const PW = 8000, PH = 5419, ASPECT = PH / PW;
const BOX = [1443, 475, 6644, 4610];                       // printed dot-lily petal extent, px
const toA = (px, py) => [px / PW - .5, (.5 - py / PH) * ASPECT];
const [bx0, by1] = toA(BOX[0], BOX[1]), [bx1, by0] = toA(BOX[2], BOX[3]);
const CENTER = [(bx0 + bx1) / 2, (by0 + by1) / 2];

// ---- the lily (same petals as the printed graphic) ----
const PHI = [], LEN = [], WID = [], OPEN = [];
for (let k = 0; k < 6; k++) { const o = k % 2 === 0; PHI.push((k * 60 + 15) * Math.PI / 180); LEN.push(o ? 1.02 : .96); WID.push(o ? .36 : .47); OPEN.push(o ? .42 : .5); }
const CUP = .32, CURL = -.38, ROUND = .85;
function petal(u, v, k, theta) {
  const w = Math.pow(Math.max(0, Math.sin(Math.PI * Math.pow(v, .62))), ROUND);
  const x = u * WID[k] * .5 * w, y = v * LEN[k] + .04, z = CUP * u * u * w * WID[k] * .5 + CURL * v * v * LEN[k];
  const ct = Math.cos(theta), st = Math.sin(theta), y1 = y * ct - z * st, z1 = y * st + z * ct;
  const cp = Math.cos(PHI[k]), sp = Math.sin(PHI[k]); return [x * cp - y1 * sp, x * sp + y1 * cp, z1];
}
const TX = -.42, TZ = .18;   // the view the printed graphic was drawn from
function printView(p) {
  let [x, y, z] = p; const cx = Math.cos(TX), sx = Math.sin(TX), y1 = y * cx - z * sx;
  const cz = Math.cos(TZ), sz = Math.sin(TZ); return [x * cz - y1 * sz, x * sz + y1 * cz];
}
let seed = 17;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;
const bez = (a, m, c, t) => { const s = 1 - t; return a.map((_, i) => s * s * a[i] + 2 * s * t * m[i] + t * t * c[i]); };
const STAM = []; for (let k = 0; k < 7; k++) { const a = k * Math.PI / 3 + .4, pist = k === 6; STAM.push(pist ? [.03, .06, .78] : [Math.cos(a) * .42, Math.sin(a) * .42, .58]); }

const UV = [], PET = [], FLAT = [], TONE = [], RND = [];
const NP = 36000, NS = 4200;
for (let i = 0; i < NP; i++) {
  const k = i % 6, r = rnd(), rim = r < .32, vein = r > .86;
  const u = rim ? (rnd() < .5 ? -1 : 1) * (.93 + rnd() * .07) : vein ? gauss() * .025 : rnd() * 2 - 1;
  const v = Math.pow(rnd(), .85);
  UV.push(u, v); PET.push(k); TONE.push(rim ? 1 : vein ? .8 : .25 + .35 * Math.pow(v, .6) * rnd()); RND.push(rnd());
  FLAT.push(...printView(petal(u, v, k, OPEN[k])));
}
for (let i = 0; i < NS; i++) {
  const k = i % 7, t = rnd(); UV.push(k, t); PET.push(6 + k); TONE.push(.9); RND.push(rnd());
  const tip = STAM[k], p = t < .82 ? bez([0, 0, .06], [tip[0] * .35, tip[1] * .35, .38], tip, t / .82) : [tip[0] + gauss() * .035, tip[1] + gauss() * .018, tip[2]];
  FLAT.push(...printView(p));
}
// fit the flat (printed) silhouette onto the postcard's own lily
let fx0 = 1e9, fx1 = -1e9, fy0 = 1e9, fy1 = -1e9;
for (let i = 0; i < FLAT.length; i += 2) { fx0 = Math.min(fx0, FLAT[i]); fx1 = Math.max(fx1, FLAT[i]); fy0 = Math.min(fy0, FLAT[i + 1]); fy1 = Math.max(fy1, FLAT[i + 1]); }
const S = Math.min((bx1 - bx0) / (fx1 - fx0), (by1 - by0) / (fy1 - fy0));
const fcx = (fx0 + fx1) / 2, fcy = (fy0 + fy1) / 2;
const flat3 = new Float32Array((NP + NS) * 3);
for (let i = 0, j = 0; i < FLAT.length; i += 2, j += 3) { flat3[j] = (FLAT[i] - fcx) * S; flat3[j + 1] = (FLAT[i + 1] - fcy) * S; flat3[j + 2] = .002; }

// ---- AR ----
const mindar = new MindARThree({ container: document.getElementById('ar'), imageTargetSrc: './postcard.mind',
  uiScanning: 'no', uiLoading: 'yes', uiError: 'yes', filterMinCF: 0.0002, filterBeta: 0.005, warmupTolerance: 3, missTolerance: 45 });
const { renderer, scene, camera } = mindar;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const anchor = mindar.addAnchor(0);
const root = new THREE.Group(); root.position.set(CENTER[0], CENTER[1], 0); anchor.group.add(root);

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(flat3, 3));
geo.setAttribute('aUV', new THREE.Float32BufferAttribute(UV, 2));
geo.setAttribute('aPet', new THREE.Float32BufferAttribute(PET, 1));
geo.setAttribute('aTone', new THREE.Float32BufferAttribute(TONE, 1));
geo.setAttribute('aR', new THREE.Float32BufferAttribute(RND, 1));
geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 2);

const U = { uPeel: { value: new Array(6).fill(0) }, uBloom: { value: new Array(6).fill(0) }, uStam: { value: 0 }, uLift: { value: 0 },
  uTime: { value: 0 }, uWave: { value: -1 }, uS: { value: S }, uVH: { value: innerHeight }, uShadow: { value: 0 }, uAlpha: { value: 0 } };
const VERT = `
  uniform float uPeel[6], uBloom[6], uStam, uLift, uTime, uWave, uS, uVH, uShadow;
  attribute vec2 aUV; attribute float aPet, aTone, aR;
  varying float vG, vA;
  const float CUP = .32, CURL = -.38;
  float LENk(int k){ return (k == 0 || k == 2 || k == 4) ? 1.02 : .96; }
  float WIDk(int k){ return (k == 0 || k == 2 || k == 4) ? .36 : .47; }
  float OPNk(int k){ return (k == 0 || k == 2 || k == 4) ? .42 : .5; }
  vec3 petal(float u, float v, int k, float th, float bl){
    float w = pow(max(0., sin(3.14159265 * pow(v, .62))), .85);
    float wd = WIDk(k) * mix(.62, 1., bl); float x = u * wd * .5 * w, y = v * LENk(k) * mix(.9, 1., bl) + .04, z = CUP * mix(1.6, 1., bl) * u * u * w * wd * .5 + mix(.06, CURL, bl * bl) * v * v * LENk(k);
    float ct = cos(th), st = sin(th); float y1 = y * ct - z * st, z1 = y * st + z * ct;
    float ph = (float(k) * 60. + 15.) * 3.14159265 / 180.; float cp = cos(ph), sp = sin(ph);
    return vec3(x * cp - y1 * sp, x * sp + y1 * cp, z1);
  }
  vec3 bz(vec3 a, vec3 m, vec3 c, float t){ float s = 1. - t; return s * s * a + 2. * s * t * m + t * t * c; }
  void main(){
    int k = int(aPet + .5);
    vec3 fp = position, p3; float peel;
    if (k < 6) {
      float bl = uBloom[k];
      float th = mix(1.38, OPNk(k), bl) + .035 * sin(uTime * 1.1 + float(k) * 1.7) * bl;   // bud -> open, then a slow breath
      p3 = petal(aUV.x, aUV.y, k, th, bl) * uS;
      peel = uPeel[k];
      // a petal peels from its base outward, so the tip leaves the card last
      peel = clamp(peel * 1.35 - (1. - aUV.y) * .0 - aUV.y * .35, 0., 1.);
      peel = peel * peel * (3. - 2. * peel);
    } else {
      int s = k - 6; float ang = float(s) * 1.0471976 + .4;
      vec3 tip = s == 6 ? vec3(.03, .06, .78) : vec3(cos(ang) * .42, sin(ang) * .42, .58);
      float t = aUV.y, g = clamp(uStam * 1.25 - t * .25, 0., 1.);
      vec3 q = t < .82 ? bz(vec3(0., 0., .06), vec3(tip.xy * .35, .38), tip, t / .82) : tip + (vec3(fract(aR * 13.7), fract(aR * 7.3), 0.) - .5) * vec3(.07, .036, .0);
      p3 = mix(vec3(0., 0., .06), q, g) * uS;
      peel = clamp(uPeel[0] * 1.2 - .2, 0., 1.);
    }
    p3.z += uLift;
    vec3 p = mix(fp, p3, peel);
    float tone = aTone;
    if (uShadow > .5) { p = vec3(p.x + p.z * .55, p.y - p.z * .55, .001); }
    vec4 mv = modelViewMatrix * vec4(p, 1.);
    gl_Position = projectionMatrix * mv;
    float sc = length(vec3(modelViewMatrix[0]));
    gl_PointSize = clamp(.0026 * sc * (.85 + aR * .3) * projectionMatrix[1][1] * uVH * .5 / -mv.z, 1., 18.);
    // light passes across the printed dots before they lift
    float d = length(fp.xy) / (uS * 1.2);
    float shine = exp(-pow((d - uWave) * 7., 2.));
    vG = mix(.74, .34, tone) - shine * .25;
    vA = uShadow > .5 ? .13 * peel : 1.;
  }`;
const FRAG = `
  uniform float uAlpha, uShadow; varying float vG, vA;
  void main(){ float d = length(gl_PointCoord - .5); if (d > .5) discard;
    vec3 c = uShadow > .5 ? vec3(.2, .19, .18) : vec3(vG) * vec3(.97, .98, 1.04) * (1. - d * .35);
    gl_FragColor = vec4(c, smoothstep(.5, .4, d) * vA * uAlpha); }`;
const mk = shadow => new THREE.ShaderMaterial({ uniforms: { ...U, uShadow: { value: shadow ? 1 : 0 } }, vertexShader: VERT, fragmentShader: FRAG,
  transparent: true, depthWrite: !shadow, depthTest: !shadow, blending: THREE.NormalBlending });
const shadowPts = new THREE.Points(geo, mk(true)); shadowPts.renderOrder = 0; shadowPts.frustumCulled = false;
const lily = new THREE.Points(geo, mk(false)); lily.renderOrder = 1; lily.frustumCulled = false;
root.add(lily);
// share uniform values between both materials
for (const m of [shadowPts.material, lily.material]) for (const key in U) if (key !== 'uShadow') m.uniforms[key] = U[key];

// ---- timeline (loops) ----
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const c01 = x => Math.min(1, Math.max(0, x));
const LOOP = 14.5;
const ORDER = [0, 3, 1, 4, 2, 5];      // alternate sides so the unfolding feels balanced
function update(T0) {
  const T = T0 % LOOP;
  U.uTime.value = T0;
  U.uAlpha.value = c01(T0 / .4);
  U.uWave.value = T < 1.2 ? -.2 + T / 1.2 * 1.4 : -1;
  const close = c01((T - 10.6) / 1.2);           // 10.6–11.8 petals fold back to a bud
  const lay = c01((T - 11.8) / 1.5);             // 11.8–13.3 and lie back down on the card
  for (let j = 0; j < 6; j++) {
    const k = ORDER[j];
    const up = ease(c01((T - 1.1 - j * .17) / 1.15));
    const open = back(c01((T - 2.9 - j * .1) / 1.7));
    U.uPeel.value[k] = up * (1 - ease(c01(lay * 1.15 - (5 - j) * .03)));
    U.uBloom.value[k] = open * (1 - ease(close));
  }
  U.uStam.value = ease(c01((T - 3.7) / 1.3)) * (1 - ease(c01((T - 10.4) / .8)));
  U.uLift.value = .09 * ease(c01((T - 1.1) / 1.6)) * (1 - ease(lay));
  root.rotation.z = .05 * Math.sin(T0 * .35) * c01((T - 4) / 2) * (1 - lay);
}

// ---- UI ----
const tag = document.getElementById('tag');
let tStart = null, tracking = false;
anchor.onTargetFound = () => { tracking = true; if (tStart === null) tStart = performance.now(); tag.textContent = 'TEMPUS FLORENS · LILIUM'; };
anchor.onTargetLost = () => { tracking = false; tag.textContent = 'SEARCHING FOR THE POSTCARD'; };
document.getElementById('replay').addEventListener('click', () => { if (tStart !== null) tStart = performance.now(); });
addEventListener('resize', () => { U.uVH.value = innerHeight * renderer.getPixelRatio(); });
document.getElementById('go').addEventListener('click', async () => {
  const err = document.getElementById('err'), go = document.getElementById('go');
  try {
    const chk = await fetch('./postcard.mind', { method: 'HEAD', cache: 'no-store' });
    if (!chk.ok) { err.hidden = false; err.textContent = 'postcard.mind not found — upload it next to postcard.html.'; return; }
    go.textContent = 'Opening…';
    await mindar.start();
    U.uVH.value = innerHeight * renderer.getPixelRatio();
    document.getElementById('intro').hidden = true; tag.hidden = false; document.getElementById('dock').hidden = false;
    renderer.setAnimationLoop(() => {
      if (tStart !== null) update((performance.now() - tStart) / 1000);
      renderer.render(scene, camera);
    });
  } catch (e) {
    go.textContent = 'Open camera'; err.hidden = false; err.textContent = 'Camera unavailable. Allow camera access, then reload.'; console.error(e);
  }
});
</script>
</body>
</html>

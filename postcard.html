<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tempus florens — postcard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root { --cream: #f7f3e8; --ink: #44474e; --dim: #8b8d92; --line: rgba(68,71,78,.28);
  --f-serif: "Cormorant Garamond", "Times New Roman", serif; --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: var(--f-mono); overflow: hidden; }
#ar { position: fixed; inset: 0; }
.mindar-ui-scanning { display: none !important; }
.intro { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: var(--cream); }
.intro .wm { font-family: var(--f-serif); font-size: clamp(50px, 14vw, 88px); line-height: .9; color: #b9b6ad; }
.intro .wm i { font-style: italic; }
.intro p { margin: 0; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); line-height: 2; }
button { font: inherit; font-size: 10px; letter-spacing: .26em; text-transform: uppercase; cursor: pointer; color: var(--ink); padding: 13px 22px; background: transparent; border: 1px solid var(--line); border-radius: 0; }
button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
.err { color: #a2453d !important; letter-spacing: .06em !important; text-transform: none !important; }
.tag { position: fixed; z-index: 10; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 16px); text-align: center; font-size: 9px; letter-spacing: .26em; color: rgba(255,255,255,.85); text-shadow: 0 1px 8px rgba(0,0,0,.5); pointer-events: none; }
.dock { position: fixed; z-index: 10; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; justify-content: center; }
.dock button { color: #fff; border-color: rgba(255,255,255,.5); background: rgba(40,40,44,.35); backdrop-filter: blur(6px); padding: 9px 16px; }
</style>
</head>
<body>
<div id="ar"></div>
<div class="intro" id="intro">
  <div class="wm">te<i>m</i>pus flore<i>n</i>s</div>
  <p>Hold the postcard in view<br>and watch the orchids bloom</p>
  <button id="go">Open camera</button>
  <p class="err" id="err" hidden></p>
</div>
<div class="tag" id="tag" hidden>SEARCHING FOR THE POSTCARD</div>
<div class="dock" id="dock" hidden><button id="replay">↻ Again</button></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

// ---------- postcard → anchor (trim 2126 × 1417 @300dpi; anchor width = 1) ----------
const CW = 2126, CH = 1417, ASPECT = CH / CW;
const pc2a = (x, y) => [x / CW - .5, (.5 - y / CH) * ASPECT];
// one bloom clip per orchid (colour on top, matte below); each clip's square = the end frame we gave the model
const OX = 21.554, OY = 122.605, SC = 1.247;
const FL = [ { c: [188, 462], half: 224 }, { c: [518, 456], half: 208 }, { c: [835, 458], half: 208 }, { c: [1154, 457], half: 205 }, { c: [1485, 456], half: 217 } ];
const START = [0, 1.1, 2.2, 3.3, 4.4];
// bloom clips (generated with Higgsfield, background removed) — hosted on Higgsfield's CDN
const CLIPS = [
  'https://d2ol7oe51mr4n9.cloudfront.net/user_3McsIk4m1p06fekoCs1471IRSr3/719a2f6a-2999-42ba-9b5b-f2ce4d3c88b1.mp4',
  'https://d2ol7oe51mr4n9.cloudfront.net/user_3McsIk4m1p06fekoCs1471IRSr3/c2a0737f-ade4-4760-91a4-5c501c43498e.mp4',
  'https://d2ol7oe51mr4n9.cloudfront.net/user_3McsIk4m1p06fekoCs1471IRSr3/d2eb97a5-7698-4bb4-b2a0-1fe52bf587f7.mp4',
  'https://d2ol7oe51mr4n9.cloudfront.net/user_3McsIk4m1p06fekoCs1471IRSr3/9fe09221-2573-4dc9-9641-1ef750d1c4b5.mp4',
  'https://d2ol7oe51mr4n9.cloudfront.net/user_3McsIk4m1p06fekoCs1471IRSr3/9d389ddf-3190-429d-8681-1a6f81921800.mp4'
];          // they wake one after another, left to right
// ---------- AR ----------
const mindar = new MindARThree({ container: document.getElementById('ar'), imageTargetSrc: './postcard.mind',
  uiScanning: 'no', uiLoading: 'yes', uiError: 'yes', filterMinCF: 0.0002, filterBeta: 0.005, warmupTolerance: 3, missTolerance: 45 });
const { renderer, scene, camera } = mindar;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const anchor = mindar.addAnchor(0);

const videos = FL.map((_, i) => {
  const v = document.createElement('video');
  v.src = CLIPS[i]; v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
  v.preload = 'auto'; v.crossOrigin = 'anonymous';
  const t = new THREE.VideoTexture(v); t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter; t.generateMipmaps = false;
  return { v, t };
});

// soft paper plate hides the printed orchids while the living ones are shown
let plateOK = false;
const plateTex = new THREE.TextureLoader().load('./plate.png', () => { plateOK = true; }, undefined, () => {});
const plateU = { tMap: { value: plateTex }, uShow: { value: 0 } };
const plate = new THREE.Mesh(new THREE.PlaneGeometry(1, 460 / CW), new THREE.ShaderMaterial({ uniforms: plateU, transparent: true, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform sampler2D tMap; uniform float uShow; varying vec2 vUv; void main(){ vec4 c = texture2D(tMap, vUv); gl_FragColor = vec4(c.rgb, c.a * uShow); }` }));
plate.position.set(0, (.5 - 670 / CH) * ASPECT, .0003); plate.renderOrder = -1; anchor.group.add(plate);

const VS = `varying vec2 vUv; uniform float uShadow, uLiftZ;
  void main(){ vUv = uv; vec3 p = position; if (uShadow > .5) { p.xy += vec2(.004, -.006) * uLiftZ / .004; p.z = .0006; }
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.); }`;
const FS = `uniform sampler2D tVid; uniform vec2 uTx; uniform float uA, uShadow, uGlow, uTime;
  varying vec2 vUv;
  vec2 cuv(vec2 t){ return vec2(t.x, .5 + t.y * .5); }
  vec2 auv(vec2 t){ return vec2(t.x, t.y * .5); }
  void main(){
    if (uShadow > .5) {
      float a = 0.;
      for (int i = -2; i <= 2; i++) for (int j = -2; j <= 2; j++) a += texture2D(tVid, auv(vUv) + vec2(float(i), float(j) * .5) * uTx * 3.).r;
      gl_FragColor = vec4(.12, .13, .2, a / 25. * .24 * uA); return;
    }
    float a = smoothstep(.08, .92, texture2D(tVid, auv(vUv)).r);
    if (a < .01) discard;
    vec3 c = texture2D(tVid, cuv(vUv)).rgb;
    c += uGlow * vec3(.05, .06, .09) * (.5 + .5 * sin(uTime * .8 + vUv.x * 6.));
    gl_FragColor = vec4(c, a * uA);
  }`;
const flowers = FL.map((F, i) => {
  const side = SC * 2 * F.half / CW;
  const U = { tVid: { value: videos[i].t }, uTx: { value: new THREE.Vector2(1 / 480, 1 / 960) }, uA: { value: 0 },
    uShadow: { value: 0 }, uGlow: { value: 0 }, uTime: { value: 0 }, uLiftZ: { value: .004 } };
  const geo = new THREE.PlaneGeometry(side, side);
  const m = new THREE.Mesh(geo, new THREE.ShaderMaterial({ uniforms: U, vertexShader: VS, fragmentShader: FS, transparent: true, depthWrite: false }));
  const sU = { ...U, uShadow: { value: 1 } };
  const sh = new THREE.Mesh(geo, new THREE.ShaderMaterial({ uniforms: sU, vertexShader: VS, fragmentShader: FS, transparent: true, depthWrite: false }));
  for (const k in U) if (k !== 'uShadow') sh.material.uniforms[k] = U[k];
  m.renderOrder = 2; sh.renderOrder = 1;
  const g = new THREE.Group(); const [ax, ay] = pc2a(OX + SC * F.c[0], OY + SC * F.c[1]); g.position.set(ax, ay, 0);
  m.position.z = .004; g.add(sh, m); anchor.group.add(g);
  return { U, g, m, phase: i * 1.37, started: false };
});

// ---------- drifting glints ----------
const NA = 650, pPos = new Float32Array(NA * 3), pA = new Float32Array(NA * 4);
let seed = 5; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
for (let i = 0; i < NA; i++) { pPos[i * 3] = (rnd() - .5) * 1.0; pPos[i * 3 + 1] = (.5 - 640 / CH) * ASPECT + (rnd() - .5) * .3; pA.set([rnd(), rnd(), rnd(), rnd()], i * 4); }
const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); pg.setAttribute('aS', new THREE.BufferAttribute(pA, 4));
const PU = { uT: { value: 0 }, uPx: { value: 400 }, uShow: { value: 0 } };
const glints = new THREE.Points(pg, new THREE.ShaderMaterial({ uniforms: PU, transparent: true, depthWrite: false,
  vertexShader: `uniform float uT, uPx, uShow; attribute vec4 aS; varying float vA, vK; varying vec3 vC;
    void main(){
      float ph = fract(uT * (.025 + aS.y * .04) + aS.x);
      vec3 p = vec3(position.xy + vec2(sin(uT * .3 + aS.z * 20.), cos(uT * .25 + aS.x * 20.)) * .015, .004 + ph * .14);
      vA = sin(3.14159 * ph) * (.5 + .5 * sin(uT * (1. + aS.z * 2.) + aS.x * 40.)) * uShow;
      vK = aS.w > .9 ? 1. : 0.; vC = mix(vec3(1.), vec3(.7, .78, 1.), aS.y);
      vec4 mv = modelViewMatrix * vec4(p, 1.);
      gl_PointSize = uPx * .0018 * (vK > .5 ? 3.4 : 1.1 + aS.y) * length(vec3(modelViewMatrix[0])) * projectionMatrix[1][1] / -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `varying float vA, vK; varying vec3 vC;
    void main(){ vec2 q = gl_PointCoord - .5; float d = length(q);
      float a = vK < .5 ? exp(-d * d * 20.) : exp(-d * d * 70.) + .6 * exp(-abs(q.x) * 36.) * exp(-abs(q.y) * 6.) + .6 * exp(-abs(q.y) * 36.) * exp(-abs(q.x) * 6.);
      a = clamp(a, 0., 1.) * vA; if (a < .01) discard; gl_FragColor = vec4(vC, a); }` }));
glints.frustumCulled = false; glints.renderOrder = 3; anchor.group.add(glints);

// ---------- timeline: bloom (video) → rest, alive → settle back into the print → again ----------
const c01 = x => Math.min(1, Math.max(0, x));
const sine = x => .5 - .5 * Math.cos(Math.PI * x);
const DUR = 8, HOLD = 8, SETTLE = 2.2, REST = 2.5, END = START[4] + DUR, LOOP = END + HOLD + SETTLE + REST;
let cycleStart = null;
function startCycle(now) {
  cycleStart = now;
  videos.forEach(({ v }) => { v.pause(); v.currentTime = 0; });
  flowers.forEach(F => { F.started = false; });
}
function update(now) {
  if (cycleStart === null) return;
  const t = (now - cycleStart) / 1000;
  if (t > LOOP) { startCycle(now); return; }
  const fadeOut = 1 - sine(c01((t - END - HOLD) / SETTLE));
  plateU.uShow.value = plateOK ? sine(c01(t / .7)) * fadeOut : 0;
  PU.uT.value = now / 1000; PU.uPx.value = renderer.domElement.height * .5; PU.uShow.value = sine(c01(t / 2)) * fadeOut;
  flowers.forEach((F, i) => {
    const lt = t - START[i];
    if (lt >= 0 && !F.started) { F.started = true; const p = videos[i].v.play(); if (p) p.catch(() => {}); }
    F.U.uA.value = sine(c01((lt + .3) / .6)) * fadeOut;
    const rest = c01((lt - DUR) / 1.5);
    F.U.uTime.value = now / 1000; F.U.uGlow.value = rest * fadeOut;
    const tt = now / 1000 + F.phase;
    F.g.rotation.z = rest * .018 * Math.sin(tt * .55);
    const sc = 1 + rest * .012 * Math.sin(tt * .7); F.g.scale.set(sc, sc, 1);
    F.m.position.z = .004 + rest * .002 * Math.sin(tt * .9);
  });
}

// ---------- UI ----------
const tag = document.getElementById('tag');
anchor.onTargetFound = () => { tag.textContent = 'TEMPUS FLORENS · ORCHIDACEAE'; if (cycleStart === null) startCycle(performance.now()); else videos.forEach(({ v }, i) => { if (flowers[i].started && v.paused && v.currentTime < DUR - .05) v.play().catch(() => {}); }); };
anchor.onTargetLost = () => { tag.textContent = 'SEARCHING FOR THE POSTCARD'; };
document.getElementById('replay').addEventListener('click', () => { if (cycleStart !== null) startCycle(performance.now()); });
document.getElementById('go').addEventListener('click', async () => {
  const err = document.getElementById('err'), go = document.getElementById('go');
  // unlock video playback inside the tap (iOS)
  await Promise.all(videos.map(async ({ v }) => { try { await v.play(); v.pause(); v.currentTime = 0; } catch (e) {} }));
  try {
    for (const f of ['./postcard.mind']) {
      const chk = await fetch(f, { method: 'HEAD', cache: 'no-store' });
      if (!chk.ok) { err.hidden = false; err.textContent = f.slice(2) + ' not found — upload it next to postcard.html.'; return; }
    }
    go.textContent = 'Opening…';
    await mindar.start();
    document.getElementById('intro').hidden = true; tag.hidden = false; document.getElementById('dock').hidden = false;
    renderer.setAnimationLoop(() => { update(performance.now()); renderer.render(scene, camera); });
  } catch (e) {
    go.textContent = 'Open camera'; err.hidden = false; console.error(e);
    const inApp = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);
    err.textContent = inApp ? 'This in-app browser blocks the camera. Open the link in Safari or Chrome.'
      : (e && e.name === 'NotAllowedError') ? 'Camera access was denied. Allow it in your browser settings, then reload.'
      : 'Camera could not start (' + ((e && (e.name || e.message)) || 'unknown') + '). Try Safari or Chrome, then reload.';
  }
});
</script>
</body>
</html>

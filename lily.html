<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tempus florens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root {
  --char: #2f2f31; --ink: #f2f2f0; --dim: #a4a7ad; --line: rgba(240,240,240,.38);
  --f-serif: "Cormorant Garamond", "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: var(--f-mono); overflow: hidden; }
#ar { position: fixed; inset: 0; }
#ar video { filter: brightness(.8) contrast(1.04) saturate(.85); }
#hud { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
.mindar-ui-scanning { display: none !important; }

.wm { font-family: var(--f-serif); font-weight: 400; letter-spacing: -.01em; line-height: .9; }
.wm i { font-style: italic; }

.intro {
  position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 24px; text-align: center; background: var(--char);
}
.intro .top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 22px); left: 22px; right: 22px; display: flex; justify-content: space-between; font-size: 9px; letter-spacing: .26em; color: var(--dim); }
.intro .wm { font-size: clamp(52px, 15vw, 96px); }
.intro .sub { font-family: var(--f-serif); font-style: italic; font-size: 22px; color: #d9d9d6; margin: 0; }
.intro p { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); margin: 18px 0 0; line-height: 2; }
button {
  font: inherit; font-size: 10px; letter-spacing: .26em; text-transform: uppercase; cursor: pointer; color: var(--ink);
  padding: 13px 22px; background: transparent; border: 1px solid var(--line); border-radius: 0;
}
button.main { margin-top: 8px; }
button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
.err { color: #ffc4c4 !important; letter-spacing: .08em !important; text-transform: none !important; }

.tag {
  position: fixed; z-index: 10; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 18px);
  display: flex; justify-content: space-between; padding: 0 20px; font-size: 9px; letter-spacing: .24em; color: rgba(240,240,240,.75); pointer-events: none;
}
.tag b { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #fff; margin-right: 8px; vertical-align: 1px; }

.cap {
  position: fixed; z-index: 10; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 76px);
  display: flex; justify-content: center; align-items: center; gap: 16px; pointer-events: none;
  opacity: 0; transform: translateY(6px); transition: opacity 1.2s ease, transform 1.2s ease; text-shadow: 0 2px 18px rgba(0,0,0,.8);
}
.cap.on { opacity: 1; transform: none; }
.cap .num { font-family: var(--f-serif); font-size: 46px; line-height: 1; }
.cap .k { display: block; font-size: 9px; letter-spacing: .3em; color: #dcdcdc; }
.cap .n { display: block; font-family: var(--f-serif); font-size: 24px; margin-top: 2px; }

.fin {
  position: fixed; z-index: 10; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 54px); text-align: center; pointer-events: none;
  opacity: 0; transition: opacity 2.4s ease; text-shadow: 0 2px 22px rgba(0,0,0,.85);
}
.fin.on { opacity: 1; }
.fin .wm { font-size: clamp(44px, 12vw, 80px); }
.fin .s { font-family: var(--f-serif); font-style: italic; font-size: 18px; margin-top: 6px; color: #e2e2e0; }

.dock {
  position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 6px;
  padding: 12px max(16px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px);
}
.dock button { padding: 9px 14px; background: rgba(30,30,32,.45); backdrop-filter: blur(6px); }
.dock button.n { font-family: var(--f-serif); font-size: 15px; letter-spacing: .04em; padding: 6px 14px; }
</style>
</head>

<div id="ar"></div>
<canvas id="hud"></canvas>

<div class="intro" id="intro">
  <div class="top"><span>HERBARIUM · PL. I / III</span><span>● AR SPECIMEN</span></div>
  <div class="wm">te<i>m</i>pus flore<i>n</i>s</div>
  <p class="sub">Herbarium of Winter Hours</p>
  <p>Point your camera<br>at the poster</p>
  <button class="main" id="go">Enter the herbarium</button>
  <button id="pv" style="border:0;padding:6px;color:var(--dim)">Preview without poster</button>
  <p class="err" id="err" hidden></p>
</div>

<div class="tag" id="tag" hidden><span id="tagL"><b></b>SEARCHING FOR SPECIMEN</span><span id="tagR">PL. — / III</span></div>
<div class="fin" id="fin"><div class="wm">te<i>m</i>pus flore<i>n</i>s</div><div class="s">Every flower keeps its own time.</div></div>

</div>

// ---------- small math ----------
const clamp01 = x => Math.min(1, Math.max(0, x));
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
let seed = 1;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;
const hex = h => { const c = new THREE.Color(h); return [c.r, c.g, c.b]; };
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

// petal surface: u in [-1,1] across, v in [0,1] along. Returns local point (petal points +y, normal +z)
function petalLocal(u, v, P) {
  const w = Math.pow(Math.max(0, Math.sin(Math.PI * Math.pow(v, .7))), P.round ?? .5);
  const x = u * P.W * .5 * w;
  const y = v * P.L;
  const z = (P.cup ?? 0) * u * u * w * P.W * .5 + (P.curl ?? 0) * v * v * P.L;
  return [x, y, z];

// rotateX(theta) then rotateZ(phi), then translate by base radius along the petal's direction
function orient(p, theta, phi, r0 = 0) {
  let [x, y, z] = p; y += r0;
  const cy = Math.cos(theta), sy = Math.sin(theta);
  const y1 = y * cy - z * sy, z1 = y * sy + z * cy;
  const cz = Math.cos(phi), sz = Math.sin(phi);
  return [x * cz - y1 * sz, x * sz + y1 * cz, z1];

function makeBuf() { return { pos: new Float32Array(N * 3), col: new Float32Array(N * 3), tag: new Int32Array(N).fill(-1) }; }
function put(b, i, p, c) { b.pos.set(p, i * 3); b.col.set(c, i * 3); }
function halo(b, i, rMin, rMax, cy = 0) {
  const d = [gauss(), gauss(), gauss()]; const l = Math.hypot(...d) || 1;
  const r = rMin + (rMax - rMin) * Math.pow(rnd(), 1.4);
  put(b, i, [d[0] / l * r, d[1] / l * r + cy, d[2] / l * r * .6], mixc([.75, .8, .88], [1, 1, 1], rnd()));

function line(a, c, t, jit) { return [a[0] + (c[0] - a[0]) * t + gauss() * jit, a[1] + (c[1] - a[1]) * t + gauss() * jit, a[2] + (c[2] - a[2]) * t + gauss() * jit]; }

// ---------- shapes (all relative to PIVOT) ----------
function shapePeony() {
  seed = 101; const b = makeBuf();
  const P = 72, petals = [];
  let total = 0;
  for (let i = 0; i < P; i++) {
    const t = i / (P - 1);
    const L = .1 + .33 * Math.pow(t, .9), W = L * (1.0 + .3 * t);
    const pt = { t, L, W, theta: 1.4 - 1.05 * Math.pow(t, .8), phi: i * 2.39996, r0: .015 + .05 * t,
      cup: .38 - .16 * t, curl: .12 * (1 - t) - .1 * t, round: .5 };
    pt.w = L * W; total += pt.w; petals.push(pt);
  }
  const cum = []; let acc = 0; petals.forEach(p => { acc += p.w / total; cum.push(acc); });
  const deep = hex('#5f6c81'), mid = hex('#a8b5c8'), ice = hex('#cfe2f1'), white = [1, 1, 1];
  const nPet = Math.floor(N * .84), nLeaf = Math.floor(N * .09), nStem = Math.floor(N * .03);
  let i = 0;
  for (; i < nPet; i++) {
    const r = rnd(); let k = cum.findIndex(c => c >= r); if (k < 0) k = P - 1;
    const pt = petals[k];
    const onEdge = rnd() < .5;
    const u = onEdge ? (rnd() < .5 ? -1 : 1) * (.88 + rnd() * .12) : rnd() * 2 - 1;
    const v = onEdge ? .15 + .85 * Math.sqrt(rnd()) : Math.sqrt(rnd());
    let p = orient(petalLocal(u, v, pt), pt.theta, pt.phi, pt.r0);
    const ct = Math.cos(-.32), st_ = Math.sin(-.32); p = [p[0], p[1] * ct - p[2] * st_, p[1] * st_ + p[2] * ct];
    let c = onEdge ? mixc(mid, white, .55 + rnd() * .45) : mixc(deep, mid, .2 + .6 * pt.t).map(x => x * (.42 + rnd() * .2));
    if (rnd() < .16) c = mixc(c, ice, .6);
    put(b, i, [p[0] + gauss() * .003, p[1] + gauss() * .003 + .04, p[2] + gauss() * .003], c);
  }
  const leaves = [{ base: [-.06, -.36, -.05], phi: 1.75, L: .46, W: .17 }, { base: [.06, -.38, -.05], phi: -1.8, L: .44, W: .16 }];
  for (let j = 0; j < nLeaf; j++, i++) {
    const lf = leaves[j % 2];
    const u = rnd() * 2 - 1, v = rnd();
    const p = orient(petalLocal(u, v, { L: lf.L, W: lf.W, cup: .12, curl: .06, round: .8 }), .22, lf.phi, 0);
    const vein = Math.abs(u) < .06 ? .5 : 0;
    put(b, i, [p[0] + lf.base[0], p[1] + lf.base[1], p[2] + lf.base[2]], mixc(hex('#7d8aa0'), white, Math.min(1, Math.pow(Math.abs(u), 4) + vein + rnd() * .2)));
  }
  for (let j = 0; j < nStem; j++, i++) {
    const s = j % 3, t = rnd();
    const a = [0, -.2, -.05], m = [(s - 1) * .05, -.55, -.05], c = [(s - 1) * .09 - .02, -.85, -.08];
    put(b, i, bez(a, m, c, t).map(x => x + gauss() * .006), mixc(hex('#7a8597'), hex('#c6ccd6'), rnd()));

function shapeLily() {
  seed = 202; const b = makeBuf();
  const white = [1, 1, 1], silver = hex('#c4cbd6'), shade = hex('#8995a8'), pearl = hex('#efe3c4');
  const petals = [];
  for (let k = 0; k < 6; k++) {
    const outer = k % 2 === 0;
    petals.push({ phi: k * Math.PI / 3 + Math.PI / 6, L: outer ? .56 : .52, W: outer ? .22 : .3, theta: 1.22 + (outer ? 0 : .04), cup: .34, curl: -.42, round: 1 });
  }
  const nPet = Math.floor(N * .74), nSta = Math.floor(N * .09), nStem = Math.floor(N * .11), nBud = Math.floor(N * .03);
  let i = 0;
  for (; i < nPet; i++) {
    const pt = petals[i % 6];
    const r3 = rnd(), onEdge = r3 < .38, onVein = r3 > .82;
    const u = onEdge ? (rnd() < .5 ? -1 : 1) * (.88 + rnd() * .12) : (onVein ? gauss() * .05 : rnd() * 2 - 1);
    const v = Math.pow(rnd(), .8);
    const p = orient(petalLocal(u, v, pt), pt.theta, pt.phi, .02);
    const c = (onEdge || onVein) ? mixc(silver, white, .5 + rnd() * .5) : mixc(shade, silver, Math.min(1, v * 1.4)).map(x => x * (.5 + rnd() * .2));
    put(b, i, [p[0] + gauss() * .004, p[1] + gauss() * .004, p[2] + gauss() * .004], c);
  }
  for (let j = 0; j < nSta; j++, i++) {
    const k = j % 7, t = rnd();
    const ang = k * Math.PI * 2 / 6 + .3, pistil = k === 6;
    const tip = pistil ? [0, .02, .5] : [Math.cos(ang) * .2, Math.sin(ang) * .2, .44];
    const mid = [tip[0] * .3, tip[1] * .3, .25];
    if (t < .78) put(b, i, bez([0, 0, .03], mid, tip, t / .78).map(x => x + gauss() * .002), mixc(silver, white, rnd() * .6));
    else put(b, i, [tip[0] + gauss() * .014, tip[1] + gauss() * .014, tip[2] + gauss() * .01], pistil ? white : pearl);
  }

    if (j % 3 === 0) {  // leaves along stem
      const lf = j % 4, u = rnd() * 2 - 1, v = rnd();
      const base = bez([0, -.05, -.06], [.04, -.5, -.08], [.06, -.95, -.1], .25 + lf * .17);
      const p = orient(petalLocal(u, v, { L: .34, W: .06, cup: .1, curl: -.12, round: .9 }), .35, (lf % 2 ? -1 : 1) * (1.0 + lf * .12), 0);
      put(b, i, [p[0] + base[0], p[1] + base[1], p[2] + base[2]], mixc(hex('#7c889b'), white, Math.pow(Math.abs(u), 3) + rnd() * .2));
    } else put(b, i, bez([0, -.05, -.06], [.04, -.5, -.08], [.06, -.95, -.1], rnd()).map(x => x + gauss() * .006), mixc(shade, silver, rnd()));
  }
  for (let j = 0; j < nBud; j++, i++) {  // closed bud on a side stem
    const t = rnd();
    if (t < .35) put(b, i, bez([.04, -.35, -.08], [.25, -.1, -.08], [.36, .22, -.02], t / .35).map(x => x + gauss() * .005), mixc(shade, silver, rnd()));
    else {
      const v = (t - .35) / .65, a = rnd() * Math.PI * 2, rr = Math.sin(Math.PI * Math.pow(v, .8)) * .045;
      const dir = new THREE.Vector3(.35, 1, .2).normalize(), base = new THREE.Vector3(.36, .22, -.02);
      const side = new THREE.Vector3(1, 0, 0).cross(dir).normalize(), up = dir.clone().cross(side);
      const p = base.addScaledVector(dir, v * .3).addScaledVector(side, Math.cos(a) * rr).addScaledVector(up, Math.sin(a) * rr);
      put(b, i, [p.x, p.y, p.z], mixc(silver, white, rnd() * .7));
    }
  }
  // tilt the flower head toward a 3/4 view (head only; stem/leaves/bud stay)
  const hx_ = -.85, hz_ = .45, cx = Math.cos(hx_), sx = Math.sin(hx_), cz = Math.cos(hz_), sz = Math.sin(hz_);
  for (let j = 0; j < nPet + nSta; j++) {
    let x = b.pos[j * 3], y = b.pos[j * 3 + 1], z = b.pos[j * 3 + 2];
    const y1 = y * cx - z * sx, z1 = y * sx + z * cx;
    b.pos[j * 3] = x * cz - y1 * sz; b.pos[j * 3 + 1] = x * sz + y1 * cz - .02; b.pos[j * 3 + 2] = z1 + .08;

    }
  });
  const nSeedPts = Math.floor(N * .84), nCore = Math.floor(N * .05), nStem = Math.floor(N * .07);
  let i = 0;
  for (; i < nSeedPts; i++) {
    let sd; const r = rnd();
    const pi = r < .6 ? 0 : (r < .79 ? 1 : 2);
    do sd = seeds[Math.floor(rnd() * seeds.length)]; while (sd.pi !== pi);
    const { c, r: R } = sd.pf, d = sd.d;
    const tipC = [c[0] + d[0] * R * .8, c[1] + d[1] * R * .8, c[2] + d[2] * R * .8];
    let p, col;
    if (rnd() < .32) { const t = .08 + rnd() * .92; p = line([c[0] + d[0] * R * .08, c[1] + d[1] * R * .08, c[2] + d[2] * R * .08], tipC, t, .0015); col = mixc(silver, white, t * .6); }
    else {
      const a = Math.floor(rnd() * 10) / 10 * Math.PI * 2 + sd.id;
      const ref = Math.abs(d[1]) < .9 ? [0, 1, 0] : [1, 0, 0];
      const s1 = new THREE.Vector3(...d).cross(new THREE.Vector3(...ref)).normalize(), s2 = new THREE.Vector3(...d).cross(s1);
      const fd = new THREE.Vector3(...d).multiplyScalar(.55).addScaledVector(s1, Math.cos(a)).addScaledVector(s2, Math.sin(a)).normalize();
      const t = Math.pow(rnd(), .7) * R * .24;
      p = [tipC[0] + fd.x * t, tipC[1] + fd.y * t, tipC[2] + fd.z * t]; col = mixc([.85, .88, .93], white, .4 + rnd() * .6);
    }
    put(b, i, p, col); b.tag[i] = sd.id;
  }
  for (let j = 0; j < nCore; j++, i++) {
    const pf = puffs[j % 3], d = [gauss(), gauss(), gauss()], l = Math.hypot(...d) || 1, rr = pf.r * .1 * Math.cbrt(rnd());
    put(b, i, [pf.c[0] + d[0] / l * rr, pf.c[1] + d[1] / l * rr, pf.c[2] + d[2] / l * rr], mixc(core, silver, rnd()));
  }
  for (let j = 0; j < nStem; j++, i++) {
    const pf = puffs[j % 3], t = rnd();
    const a = [pf.c[0], pf.c[1] - pf.r * .1, pf.c[2]], c = [pf.c[0] * .3, -.92, pf.c[2] - .05], m = [pf.c[0] * .8, (a[1] + c[1]) / 2, pf.c[2]];
    put(b, i, bez(a, m, c, t).map(x => x + gauss() * .004), mixc(core, silver, rnd()));
  }
  for (; i < N; i++) halo(b, i, .55, .9);
  b.seedCount = seeds.length;
  return b;
}

function shapeBlown(dand) {
  seed = 404; const b = makeBuf();
  b.col.set(dand.col); b.pos.set(dand.pos);
  const off = [];
  for (let s = 0; s < dand.seedCount; s++) {
    const fly = rnd() < .88, k = .5 + rnd() * 1.9;
    off.push(fly ? [1.0 * k + gauss() * .15, .55 * k + gauss() * .25, .45 * k + gauss() * .2, rnd() * 6] : [0, 0, 0, 0]);
  }
  for (let i = 0; i < N; i++) {
    const s = dand.tag[i]; if (s < 0) continue;
    const o = off[s];
    b.pos[i * 3] += o[0]; b.pos[i * 3 + 1] += o[1] + Math.sin(o[3]) * .08; b.pos[i * 3 + 2] += o[2];
  }
  return b;
}

async function shapeOrigin() {
  seed = 505; const b = makeBuf();
  const img = new Image(); img.src = ORIGIN_PNG; await img.decode();
  const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height;
  const g = cv.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, img.width, img.height).data;
  const cand = [];
  for (let y = 0; y < img.height; y++) for (let x = 0; x < img.width; x++) { const v = d[(y * img.width + x) * 4]; if (v > 95) cand.push([x, y, v / 255]); }
  const [x0, y0, x1, y1] = ORIGIN_BOX;
  for (let i = 0; i < N; i++) {
    let c; do c = cand[Math.floor(rnd() * cand.length)]; while (rnd() > c[2] * 1.1);
    const px = x0 + (c[0] + rnd()) / img.width * (x1 - x0), py = y0 + (c[1] + rnd()) / img.height * (y1 - y0);
    const ax = px / PW - .5, ay = (.5 - py / PH) * POSTER_ASPECT;
    put(b, i, [ax - PIVOT.x, ay - PIVOT.y, .004 + rnd() * .01 - PIVOT.z], mixc(hex('#b9c6d6'), [1, 1, 1], c[2]));
  }
  return b;
}

// ---------- AR + renderer ----------
const mindar = new MindARThree({
  container: document.getElementById('ar'), imageTargetSrc: './lily.mind',
  uiScanning: 'no', uiLoading: 'yes', uiError: 'yes', filterMinCF: 0.0005, filterBeta: 0.01,
});
const { renderer, scene, camera } = mindar;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const anchor = mindar.addAnchor(0);
const pivot = new THREE.Group(); pivot.position.copy(PIVOT); anchor.group.add(pivot);

const geo = new THREE.BufferGeometry();
const aA = new THREE.BufferAttribute(new Float32Array(N * 3), 3), aB = new THREE.BufferAttribute(new Float32Array(N * 3), 3);
const cA = new THREE.BufferAttribute(new Float32Array(N * 3), 3), cB = new THREE.BufferAttribute(new Float32Array(N * 3), 3);
const aR = new Float32Array(N * 4); seed = 9; for (let i = 0; i < N * 4; i++) aR[i] = rnd();
geo.setAttribute('position', aA); geo.setAttribute('aB', aB); geo.setAttribute('cA', cA); geo.setAttribute('cB', cB);
geo.setAttribute('aR', new THREE.BufferAttribute(aR, 4));
geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 4);

const uni = { uMix: { value: 0 }, uTime: { value: 0 }, uScatter: { value: 0 }, uSwirl: { value: 0 }, uSize: { value: .0047 },
  uWarm: { value: 0 }, uAlpha: { value: 0 }, uVH: { value: innerHeight * renderer.getPixelRatio() }, uIce: { value: 0 } };
const mat = new THREE.ShaderMaterial({
  uniforms: uni, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uMix, uTime, uScatter, uSwirl, uSize, uWarm, uVH, uIce;
    attribute vec3 aB, cA, cB; attribute vec4 aR;
    varying vec3 vC; varying float vA;
    void main() {
      float st = aR.x * .45;
      float m = clamp((uMix - st) / .55, 0., 1.);
      m = m * m * (3. - 2. * m);
      vec3 p = mix(position, aB, m);
      float s = sin(m * 3.14159265);
      vec3 dir = normalize(aR.yzw - .5 + 1e-3);
      p += dir * s * uScatter * (.25 + aR.x * .9);
      float ang = s * uSwirl * (.5 + aR.y);
      float c = cos(ang), sn = sin(ang);
      p.xz = mat2(c, -sn, sn, c) * p.xz;
      p += .005 * vec3(sin(uTime * 1.3 + aR.y * 30.), cos(uTime * 1.1 + aR.z * 30.), sin(uTime * .9 + aR.w * 30.));
      vec3 col = mix(cA, cB, m);
      col = mix(col, col * vec3(.86, .94, 1.08) + vec3(0., .02, .06), uIce);
      col = mix(col, col * vec3(1.05, .98, .95) + vec3(.07, .035, .045), uWarm);
      float tw = .5 + .5 * sin(uTime * (1.4 + aR.z * 5.) + aR.w * 80.);
      vC = col * (.7 + .55 * tw);
      vA = .45 + .55 * tw;
      vec4 mv = modelViewMatrix * vec4(p, 1.);
      gl_Position = projectionMatrix * mv;
      float spark = step(.985, aR.x) * 2.2;
      float sc = length(vec3(modelViewMatrix[0]));
      gl_PointSize = clamp(uSize * sc * (.55 + aR.x + spark) * (.75 + .5 * tw) * projectionMatrix[1][1] * uVH * .5 / -mv.z, 1., 48.);
    }`,
  fragmentShader: `
    uniform float uAlpha;
    varying vec3 vC; varying float vA;
    void main() {
      vec2 q = gl_PointCoord - .5; float d = length(q);
      if (d > .5) discard;
      float a = smoothstep(.5, .05, d); a *= a;
      a += smoothstep(.16, 0., d) * .5;
      gl_FragColor = vec4(vC, a * vA * uAlpha * .9);
    }`,
});
const points = new THREE.Points(geo, mat); points.frustumCulled = false; pivot.add(points);

// glow + snow
function radial() { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.3, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); }
const glowTex = radial();
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: '#cfe0f0', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
glow.position.set(0, .05, -.05); pivot.add(glow);
const SN = 600, snowPos = new Float32Array(SN * 3), snow = [];
seed = 77; for (let i = 0; i < SN; i++) snow.push([(rnd() - .5) * 2.2, (rnd() - .5) * 2.6, rnd() * 1.1 - .3, .04 + rnd() * .08, rnd() * 6]);
const snowGeo = new THREE.BufferGeometry(); snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snowMat = new THREE.ShaderMaterial({
  uniforms: { uVH: uni.uVH, uOp: { value: 0 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `uniform float uVH; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); gl_Position = projectionMatrix * mv;
    float sc = length(vec3(modelViewMatrix[0])); gl_PointSize = clamp(.009 * sc * projectionMatrix[1][1] * uVH * .5 / -mv.z, 1., 24.); }`,
  fragmentShader: `uniform float uOp; void main(){ float d = length(gl_PointCoord - .5); if (d > .5) discard; gl_FragColor = vec4(1., 1., 1., smoothstep(.5, 0., d) * uOp); }`,
});
const snowPts = new THREE.Points(snowGeo, snowMat);
snowPts.frustumCulled = false; pivot.add(snowPts);

// ---------- timeline ----------
const SHAPES = {};
const SEGS = [
  { t0: 0,    t1: .9,  A: 'origin', B: 'origin' },
  { t0: .9, t1: 3.8, A: 'origin', B: 'lily', sc: .65, sw: 2.0, flare: 1, ch: 1 },
  { t0: 3.8, t1: 1e9, A: 'lily', B: 'lily' },
];
const CH = { 1: ['I', 'TOUCH', 'Lily'], 2: ['II', 'BREATH', 'Dandelion'], 3: ['III', 'WARMTH', 'Frozen Peony'] };
const CH_START = { 1: .9 };
let segIdx = -1, curCh = 0;
const capNum = document.getElementById('capNum'), capK = document.getElementById('capK'), capN = document.getElementById('capN');
const capEl = document.getElementById('cap'), finEl = document.getElementById('fin'), tagR = document.getElementById('tagR');

function setSeg(i) {
  segIdx = i; const s = SEGS[i];
  aA.array.set(SHAPES[s.A].pos); cA.array.set(SHAPES[s.A].col);
  aB.array.set(SHAPES[s.B].pos); cB.array.set(SHAPES[s.B].col);
  aA.needsUpdate = aB.needsUpdate = cA.needsUpdate = cB.needsUpdate = true;
}

function update(T, dt) {
  let i = SEGS.findIndex(s => T >= s.t0 && T < s.t1); if (i < 0) i = SEGS.length - 1;
  if (i !== segIdx) setSeg(i);
  const s = SEGS[i], p = clamp01((T - s.t0) / (s.t1 - s.t0));
  uni.uMix.value = s.A === s.B ? 1 : p;
  uni.uScatter.value = s.sc || 0; uni.uSwirl.value = s.sw || 0;
  uni.uTime.value = T;
  uni.uAlpha.value = clamp01(T / .6);
  uni.uIce.value = (s.B === 'peony' || s.A === 'peony') ? 1 - eInOut(clamp01((T - 1000000000.0) / 3.5)) : 0;
  uni.uWarm.value = eInOut(clamp01((T - 1000000000.0) / 3.5));

  // bloom pulse + glow flare
  const fp = s.flare ? Math.sin(Math.PI * clamp01((p - .5) / .5)) : 0;
  pivot.scale.setScalar(1 + .07 * fp);
  pivot.rotation.y = .14 * Math.sin(T * .22);
  pivot.rotation.x = -.04 + .03 * Math.sin(T * .17);
  const flare = s.flare ? Math.exp(-Math.pow((p - .62) * 4.5, 2)) : 0;
  glow.material.opacity = .14 + .5 * flare + (T > 1000000000.0 ? .12 * uni.uWarm.value : 0);
  glow.scale.setScalar(1.2 + 1.4 * flare);
  glow.material.color.set(uni.uWarm.value > .01 ? '#f6e6e8' : '#cfe0f0');

  // snow
  snowMat.uniforms.uOp.value = clamp01((T - .5) / 2) * .7;
  for (let k = 0; k < SN; k++) {
    const f = snow[k]; let y = f[1] - T * f[3]; y = ((y + 1.3) % 2.6 + 2.6) % 2.6 - 1.3;
    snowPos[k * 3] = f[0] + Math.sin(T * .5 + f[4]) * .03; snowPos[k * 3 + 1] = y; snowPos[k * 3 + 2] = f[2];
  }
  snowGeo.attributes.position.needsUpdate = true;

  // captions
  let ch = 0; for (const c of [1, 2, 3]) if (T >= CH_START[c] + 1.2) ch = c;
  if (ch !== curCh) {
    curCh = ch; capEl.classList.remove('on');
    if (ch) setTimeout(() => {
      [capNum.textContent, capK.textContent, capN.textContent] = CH[ch];
      tagR.textContent = 'PL. ' + CH[ch][0] + ' / III';
      capEl.classList.add('on');
    }, 500);
  }
  finEl.classList.toggle('on', T > 7.5);
}

// ---------- poster-style frames (detection only) ----------
const hud = document.getElementById('hud'), hx = hud.getContext('2d');
function sizeHud() { const d = Math.min(devicePixelRatio, 2); hud.width = innerWidth * d; hud.height = innerHeight * d; hx.setTransform(d, 0, 0, d, 0, 0); uni.uVH.value = innerHeight * renderer.getPixelRatio(); }
addEventListener('resize', sizeHud); sizeHud();
const tv = new THREE.Vector3();
function proj(x, y, z) { tv.set(x, y, z).applyMatrix4(anchor.group.matrixWorld).project(camera); return [(tv.x + 1) / 2 * innerWidth, (1 - tv.y) / 2 * innerHeight]; }
function frame(x0, y0, x1, y1, a, grow) {
  const z = .002, P = [proj(x0, y0, z), proj(x1, y0, z), proj(x1, y1, z), proj(x0, y1, z)];
  hx.strokeStyle = `rgba(240,240,240,${.7 * a})`; hx.fillStyle = `rgba(255,255,255,${a})`; hx.lineWidth = 1;
  hx.beginPath();
  for (let k = 0; k < 4; k++) {
    const A = P[k], B = P[(k + 1) % 4];
    hx.moveTo(A[0], A[1]); hx.lineTo(A[0] + (B[0] - A[0]) * grow, A[1] + (B[1] - A[1]) * grow);
  }
  hx.stroke();
  P.forEach(q => { hx.beginPath(); hx.arc(q[0], q[1], 2.4, 0, Math.PI * 2); hx.fill(); });
}
function drawHud(T) {
  hx.clearRect(0, 0, innerWidth, innerHeight);
  if (T < 0 || !anchor.group.visible) return;
  const a = clamp01(T / .3) * (1 - clamp01((T - 2.6) / .8));
  if (a <= 0) return;
  const g = eInOut(clamp01(T / .9));
  frame(-.35, .28, .35, -.22, a, g);
  frame(.24, .3, .41, .13, a * .8, eInOut(clamp01((T - .2) / .9)));
  frame(-.4, -.12, -.08, -.42, a * .8, eInOut(clamp01((T - .35) / .9)));
}

// ---------- UI / loop ----------
const tag = document.getElementById('tag'), tagL = document.getElementById('tagL');
let tStart = null, tracking = false;
anchor.onTargetFound = () => { tracking = true; if (tStart === null) tStart = performance.now(); tagL.innerHTML = '<b></b>SPECIMEN 00 · DETECTED'; };
anchor.onTargetLost = () => { tracking = false; tagL.innerHTML = '<b></b>SEARCHING FOR SPECIMEN'; };
function jump(t) { segIdx = -1; curCh = -1; finEl.classList.remove('on'); tStart = performance.now() - t * 1000; }
document.querySelectorAll('[data-ch]').forEach(b => b.addEventListener('click', () => jump(CH_START[b.dataset.ch])));
document.getElementById('replay').addEventListener('click', () => { if (tStart !== null) jump(0); });

const ready = (async () => {
  SHAPES.origin = await shapeOrigin();
  SHAPES.lily = shapeLily();
  SHAPES.dand = shapeDandelion();
  SHAPES.blown = shapeBlown(SHAPES.dand);
  SHAPES.peony = shapePeony();
})();

function startPreview() {
  document.getElementById('intro').hidden = true;
  tag.hidden = false; document.getElementById('dock').hidden = false;
  tagL.innerHTML = '<b></b>PREVIEW · NO CAMERA';
  renderer.setSize(innerWidth, innerHeight);
  renderer.domElement.style.cssText = 'position:fixed;inset:0;width:100%;height:100%';
  if (!renderer.domElement.parentNode) document.getElementById('ar').appendChild(renderer.domElement);
  scene.background = new THREE.Color('#2f2f31');
  camera.fov = 42; camera.aspect = innerWidth / innerHeight; camera.near = .05; camera.far = 50;
  const dist = Math.max(2.2, 2.2 * .75 / camera.aspect);
  camera.position.set(0, 0, dist); camera.lookAt(0, 0, 0); camera.updateProjectionMatrix();
  anchor.group.matrixAutoUpdate = false; anchor.group.matrix.identity(); anchor.group.visible = true;
  new THREE.TextureLoader().load('./lily.jpg', t => {
    t.colorSpace = THREE.SRGBColorSpace;
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(1, POSTER_ASPECT), new THREE.MeshBasicMaterial({ map: t }));
    anchor.group.add(pl);
  });
  let yaw = 0, drag = null;
  addEventListener('pointerdown', e => drag = e.clientX);
  addEventListener('pointerup', () => drag = null);
  addEventListener('pointermove', e => { if (drag !== null) { yaw += (e.clientX - drag) * .005; drag = e.clientX; } });
  tStart = performance.now();
  renderer.setAnimationLoop(() => {
    const T = (performance.now() - tStart) / 1000;
    camera.position.set(Math.sin(yaw) * dist, 0, Math.cos(yaw) * dist); camera.lookAt(0, 0, .15);
    anchor.group.updateMatrixWorld(true);
    update(T, 0); renderer.render(scene, camera); drawHud(T);
  });
}
document.getElementById('pv').addEventListener('click', async () => { await ready; startPreview(); });
window.__jump = t => jump(t);

document.getElementById('go').addEventListener('click', async () => {
  const err = document.getElementById('err'), go = document.getElementById('go');
  try {
    const chk = await fetch('./lily.mind', { method: 'HEAD', cache: 'no-store' });
    if (!chk.ok) { err.hidden = false; err.textContent = 'lily.mind not found — upload it next to index.html.'; return; }
    go.textContent = 'Opening…';
    await ready;
    await mindar.start();
    document.getElementById('intro').hidden = true;
    tag.hidden = false; document.getElementById('dock').hidden = false;
    let last = performance.now();
    renderer.setAnimationLoop(() => {
      const now = performance.now(), dt = (now - last) / 1000; last = now;
      const T = tStart === null ? -1 : (now - tStart) / 1000;
      if (T >= 0) update(T, dt);
      renderer.render(scene, camera);
      drawHud(T);
    });
  } catch (e) {
    go.textContent = 'Enter the herbarium';
    err.hidden = false; err.textContent = 'Camera unavailable. Allow camera access in your browser settings, then reload.';
    console.error(e);
  }
});
</script>
</body>
</html>
